<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>${TITLE}</title>
    <meta name="description" content="HTML DOM Analysis - ${FILE_NAME}">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.5.4/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-babia-components@1.3.4/dist/aframe-babia-components.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <a-scene background="color: ${BACKGROUND_COLOR}" xr-mode-ui="enabled: true; XRMode: xr">
        <a-entity environment="preset: ${ENVIRONMENT_PRESET}; groundColor: ${GROUND_COLOR}" hide-on-enter-ar></a-entity>
        <a-light type="point" intensity="1" position="-10 20 30"></a-light>

        <a-entity id="htmlDOM"
            scale="0.3 0.3 0.3"
            position="-2 2 0"
            babia-html="renderHTML: true; renderHTMLOnlyLeafs: true; distanceLevels: 0.7"></a-entity>

        <a-entity position="0 3 0">
            <a-plane id="rotateX" class="babiaxraycasterclass" position="-1 1 -3" width="1" height="0.5" color="blue"
                rotation="0 0 0" text="value: RotateX; color: white; align: center; width: 3;"></a-plane>

            <a-plane id="rotateY" class="babiaxraycasterclass" position="0 1 -3" width="1" height="0.5" color="green"
                rotation="0 0 0" text="value: RotateY; color: white; align: center; width: 3;"></a-plane>

            <a-plane id="rotateZ" class="babiaxraycasterclass" position="1 1 -3" width="1" height="0.5" color="red"
                rotation="0 0 0" text="value: RotateZ; color: white; align: center; width: 3;"></a-plane>

            <a-plane id="collapse" class="babiaxraycasterclass" position="-1 0.5 -3" width="1" height="0.5"
                color="yellow" rotation="0 0 0"
                text="value: Collapse; color: black; align: center; width: 3;"></a-plane>

            <a-plane id="expand" class="babiaxraycasterclass" position="1 0.5 -3" width="1" height="0.5" color="purple"
                rotation="0 0 0" text="value: Expand; color: white; align: center; width: 3;"></a-plane>
        </a-entity>

        <a-entity id="cameraRig" movement-controls="fly: true; speed: 0.1" position="0 1.6 3">
            <a-entity id="head" camera babia-camera="raycasterMouse: .babiaxraycasterclass; raycasterHand: .babiaxraycasterclass" look-controls>
                <a-entity></a-entity>
            </a-entity>

            <a-entity
                id="leftController"
                laser-controls="hand: left"
                meta-touch-controls="hand: left; model: true"
                daydream-controls="hand: left"
                gearvr-controls="hand: left"
                hp-mixed-reality-controls="hand: left"
                magicleap-controls="hand: left"
                oculus-go-controls="hand: left"
                valve-index-controls="hand: left"
                vive-controls="hand: left"
                vive-focus-controls="hand: left"
                windows-motion-controls="hand: left"
                generic-tracked-controller-controls="hand: left">
            </a-entity>

            <a-entity
                id="rightController"
                laser-controls="hand: right"
                meta-touch-controls="hand: right; model: true"
                daydream-controls="hand: right"
                gearvr-controls="hand: right"
                hp-mixed-reality-controls="hand: right"
                magicleap-controls="hand: right"
                oculus-go-controls="hand: right"
                valve-index-controls="hand: right"
                vive-controls="hand: right"
                vive-focus-controls="hand: right"
                windows-motion-controls="hand: right"
                generic-tracked-controller-controls="hand: right"
                cursor="rayOrigin: entity; fuse: false"
                raycaster="objects: .babiaxraycasterclass; far: 100; showLine: true; lineColor: blue; lineOpacity: 0.5">
            </a-entity>

            <a-entity
                cursor="rayOrigin: mouse"
                raycaster="objects: .babiaxraycasterclass; far: 100">
            </a-entity>
        </a-entity>

    </a-scene>

    <script id="codexr-dom-html-payload" type="application/json">${HTML_CONTENT_JSON}</script>
    <script>
        function readInitialDomHtmlPayload() {
            const payloadElement = document.getElementById('codexr-dom-html-payload');
            if (!payloadElement) {
                return '';
            }

            try {
                return JSON.parse(payloadElement.textContent || '""');
            } catch (error) {
                console.warn('DOM visualization payload is not valid JSON', error);
                return '';
            }
        }

        window.__CODEXR_DOM_HTML_PAYLOAD__ = readInitialDomHtmlPayload();

        function getCurrentBabiaHtmlState() {
            const entity = document.querySelector('#htmlDOM');
            const currentConfig = entity ? entity.getAttribute('babia-html') : null;
            return {
                entity,
                html: typeof window.__CODEXR_DOM_HTML_PAYLOAD__ === 'string' && window.__CODEXR_DOM_HTML_PAYLOAD__.length > 0
                    ? window.__CODEXR_DOM_HTML_PAYLOAD__
                    : currentConfig && typeof currentConfig.html === 'string'
                        ? currentConfig.html
                        : '',
                distanceLevels: currentConfig && typeof currentConfig.distanceLevels === 'number'
                    ? currentConfig.distanceLevels
                    : 0.7,
            };
        }

        function applyBabiaHtml(distanceLevels, htmlContent) {
            const currentState = getCurrentBabiaHtmlState();
            const entity = currentState.entity;
            const nextHtml = typeof htmlContent === 'string' && htmlContent.length > 0
                ? htmlContent
                : currentState.html;

            if (!entity || !nextHtml) {
                console.warn('DOM visualization could not be updated because the HTML payload is missing');
                return;
            }

            window.__CODEXR_DOM_HTML_PAYLOAD__ = nextHtml;
            entity.removeAttribute('babia-html');
            requestAnimationFrame(() => {
                entity.setAttribute('babia-html', {
                    renderHTML: true,
                    renderHTMLOnlyLeafs: true,
                    html: nextHtml,
                    distanceLevels: distanceLevels,
                });
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            applyBabiaHtml(0.7, window.__CODEXR_DOM_HTML_PAYLOAD__);
        });

        document.querySelector('#rotateX').addEventListener('click', function () {
            let entity = document.querySelector('#htmlDOM');
            let rotation = entity.getAttribute('rotation');
            entity.setAttribute('rotation', { x: rotation.x + 90, y: rotation.y, z: rotation.z });
        });

        document.querySelector('#rotateY').addEventListener('click', function () {
            let entity = document.querySelector('#htmlDOM');
            let rotation = entity.getAttribute('rotation');
            entity.setAttribute('rotation', { x: rotation.x, y: rotation.y + 90, z: rotation.z });
        });

        document.querySelector('#rotateZ').addEventListener('click', function () {
            let entity = document.querySelector('#htmlDOM');
            let rotation = entity.getAttribute('rotation');
            entity.setAttribute('rotation', { x: rotation.x, y: rotation.y, z: rotation.z + 90 });
        });

        document.querySelector('#collapse').addEventListener('click', function () {
            applyBabiaHtml(0.01);
        });

        document.querySelector('#expand').addEventListener('click', function () {
            applyBabiaHtml(0.7);
        });
    </script>
    <script>
    window.__CODEXR_VIRTUAL_SCREEN_CONFIG__ = {
        enabled: true,
        broadcastEnabled: true,
        signalingPath: '/codexr-broadcast',
        sceneSelector: 'a-scene',
        followAnchorSelector: '#cameraRig',
        anchoredPosition: { x: 3.2, y: 4.2, z: -0.4 },
        anchoredRotation: { x: -10, y: -18, z: 0 },
        followOffset: { x: 0.8, y: 0.4, z: -2.1 },
        followRotation: { x: 0, y: 0, z: 0 },
        labels: {
            idle: 'Share your screen or VS Code window while you inspect this DOM tree.'
        }
    };
</script>
<script nonce="${nonce}" src="./virtualScreenRuntime.js"></script>
<script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
