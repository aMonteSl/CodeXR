<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>${TITLE}</title>
    <meta name="description" content="Data visualization with BabiaXR">
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <!-- A-Frame Extras (v7.5.4: añade compatibilidad con gamepad-controls para 1.7.0+) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script> 

    <!-- Babia -->
    <script src="https://unpkg.com/aframe-babia-components@1.3.4/dist/aframe-babia-components.min.js"></script>

    <!-- Environment Component (v1.5.0: última publicada) -->
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>

    <!-- Geometry Merger Component (v2.0.1: última publicada) -->
    <script src="https://unpkg.com/aframe-geometry-merger-component@2.0.1/dist/aframe-geometry-merger-component.min.js"></script> 
    
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>
<body>
    <a-scene id="scene"
    light="defaultLightsEnabled: false"
    background="color: ${BACKGROUND_COLOR}"
    xr-mode-ui="enabled: true; XRMode: xr"
    codexr-pointer-policy
    device-orientation-permission-ui>

        
        <!-- Environment -->
        <a-entity id="env" environment="preset: ${ENVIRONMENT_PRESET}; groundColor: ${GROUND_COLOR}" hide-on-enter-ar></a-entity>

        <!-- CodeXR room (kept independent from environment preset) -->
        <a-entity
            id="codexrRoom"
            position="0 0 -10"
            hide-on-enter-ar
            codexr-room="
                width: 22;
                depth: 26;
                height: 11;
                openSide: south;
                wallTexture: ./assets/codexr/xr-room/textures/wall.svg;
                floorTexture: ./assets/codexr/xr-room/textures/floor.svg;
                ceilingTexture: ./assets/codexr/xr-room/textures/ceiling.svg;
                railingTexture: ./assets/codexr/xr-room/textures/railing.svg;
                glassRailing: true;
                glassRailingOpacity: 0.34;
                glassRailingTint: #d7ecff;
            ">
        </a-entity>

        <a-entity
            id="codexrScreenManager"
            codexr-multi-screen-manager="maxScreens: 5; wall: west"
            position="0 0 0">
        </a-entity>

        <!-- Light -->
        <a-entity light="color: #fff; type:ambient; intensity: 0.85"></a-entity>
        
        <!-- Data -->
        <a-entity id="data" babia-queryjson="url: ${DATA_SOURCE}"></a-entity>
        
        <!-- Analysis table and owned visualization surface -->
        <a-entity
            id="codexrAnalysisTable"
            codexr-analysis-table="mode: single; width: 6.514; depth: 4.118; anchorX: 0; anchorY: 1; anchorZ: -18">
        </a-entity>
        <!-- Brand mark over the table while no analysis is loaded. Decoration
             only: it carries no raycaster class, and it lives outside the
             analysis surface so the selection sweep never owns it. -->
        <a-entity
            id="codexrBrandLogo"
            data-codexr-role="brand-logo auxiliary"
            codexr-logo="anchorX: 0; anchorY: 1.62; anchorZ: -18; width: 1.8">
        </a-entity>
        <a-entity
            id="codexrAnalysisSurface"
            data-codexr-analysis-surface="true">
            <a-entity
                id="codexrNormalAnalysisRoot"
                data-codexr-analysis-root="true"
                data-codexr-analysis-mode="single"
                data-codexr-normal-root="true">
                <!-- Tree Structure (Only for boats charts) -->
                ${TREE_BUILDER}

                <!-- Chart Component (Dynamic) -->
                ${CHART_COMPONENT}
            </a-entity>
        </a-entity>

        <!-- Babia UI panel and toggle (optional) -->
        ${BABIA_UI_COMPONENT}

        <!-- The rig stands ON THE FLOOR (y=0) and the eye height lives on the
             camera. That split is what A-Frame expects: look-controls zeroes
             the camera's local position when a real headset session starts
             (and restores it on exit), so the local-floor pose — which already
             carries the user's real height — replaces the desktop offset
             instead of stacking on top of it. Put the offset on the rig
             instead and you end up either floating or standing on the floor
             with your eyes at ankle height. -->
        <a-entity id="rig" movement-controls="fly: false" position="0.07 0 -10.75"
        codexr-immersive-rig="arPosition: 0.07 0 -14.7">
        <!-- Cámara + cursor de mirada (activo SOLO en VR sin mandos; lo gobierna codexr-pointer-policy) -->
        <a-entity id="head" camera position="0 1.75 0" look-controls>
            <a-entity
            id="gazeCursor"
            visible="false"
            cursor="rayOrigin: entity; fuse: false"
            raycaster="objects: .babiaxraycasterclass; far: 100; enabled: false">
                <a-ring
                position="0 0 -0.6"
                radius-inner="0.008"
                radius-outer="0.014"
                material="color: #ffffff; shader: flat; opacity: 0.85"></a-ring>
            </a-entity>
        </a-entity>

        <!-- Mando izquierdo: modelo visible; codexr-pointer-policy le retira el cursor/raycaster que laser-controls inyecta -->
        <a-entity
        id="leftController"
        laser-controls="hand: left"
        meta-touch-controls="hand: left; model: true"
        daydream-controls="hand: left"
        gearvr-controls="hand: left"
        hp-mixed-reality-controls="hand: left"
        magicleap-controls="hand: left"
        oculus-go-controls="hand: left"
        valve-index-controls="hand: left"
        vive-controls="hand: left"
        vive-focus-controls="hand: left"
        windows-motion-controls="hand: left"
        generic-tracked-controller-controls="hand: left">
        </a-entity>

        <!-- Mando derecho: puntero por defecto cuando hay mandos conectados -->
        <a-entity
        id="rightController"
        laser-controls="hand: right"
        meta-touch-controls="hand: right; model: true"
        daydream-controls="hand: right"
        gearvr-controls="hand: right"
        hp-mixed-reality-controls="hand: right"
        magicleap-controls="hand: right"
        oculus-go-controls="hand: right"
        valve-index-controls="hand: right"
        vive-controls="hand: right"
        vive-focus-controls="hand: right"
        windows-motion-controls="hand: right"
        generic-tracked-controller-controls="hand: right"
        cursor="rayOrigin: entity; fuse: false"
        raycaster="objects: .babiaxraycasterclass; far: 100; showLine: true; lineColor: blue; lineOpacity: 0.5">
        </a-entity>

        <!-- Cursor para interacción con ratón (puntero activo en navegador normal) -->
        <a-entity
        id="mouseCursor"
        cursor="rayOrigin: mouse"
        raycaster="objects: .babiaxraycasterclass; far: 100">
        </a-entity>
        </a-entity>
    </a-scene>
    <script id="codexr-chart-base-config" type="application/json">${CHART_BASE_CONFIG}</script>
    <script id="codexr-tooling-config-collaboration" type="application/json">{"enabled":true,"collaborationEnabled":true,"presenceEnabled":true,"cursorPresenceEnabled":false,"sceneSelector":"#scene","roomSignalingPath":"/codexr-room","sessionEndpoint":"/api/collaboration/session","broadcastSocketPath":"/codexr-broadcast","followAnchorSelector":"#rig"}</script>
    <script id="codexr-tooling-config-virtual-screen" type="application/json">{"enabled":true,"broadcastEnabled":true,"signalingPath":"/codexr-broadcast","sceneSelector":"#scene","followAnchorSelector":"#rig","anchoredPosition":{"x":0,"y":4.2,"z":-22},"anchoredRotation":{"x":-12,"y":0,"z":0},"followOffset":{"x":0,"y":0.8,"z":-2.4},"followRotation":{"x":0,"y":0,"z":0}}</script>
<script nonce="${nonce}" src="./codexrAvatarRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrCollaborationRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./virtualScreenRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrMultiScreenManagerRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./guideScreenRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrRoomRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrLogoRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrCommonRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrGitRefPickerRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrPointerPolicyRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrImmersiveRigRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./xrChartMappingUiRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./xrChartDebugRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./analysisTableRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./analysisModeRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./historicalComparisonRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./projectEvolutionRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./renderBudgetRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./dependencyVisualBudgetRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./dependencyGraphRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="./codexrDebugRuntime.js?v=${nonce}"></script>
<script nonce="${nonce}" src="${scriptUri}"></script>
${BABIA_UI_SCRIPT}
</body>
</html>
