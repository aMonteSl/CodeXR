<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f252a"/>
      <stop offset="50%" stop-color="#3a444b"/>
      <stop offset="100%" stop-color="#20272c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e5f3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#95b8ca" stop-opacity="0.32"/>
    </linearGradient>
    <pattern id="modernRailing" width="64" height="128" patternUnits="userSpaceOnUse">
      <rect width="64" height="128" fill="#2d353c"/>
      <rect x="0" y="0" width="64" height="10" fill="url(#frame)"/>
      <rect x="0" y="118" width="64" height="10" fill="url(#frame)"/>
      <rect x="6" y="14" width="52" height="100" fill="url(#glass)"/>
      <rect x="6" y="14" width="52" height="100" fill="none" stroke="#5f727d" stroke-width="1" opacity="0.65"/>
      <rect x="30" y="0" width="4" height="128" fill="#151a1f" opacity="0.75"/>
      <rect x="31" y="0" width="2" height="128" fill="#5f6d76" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#modernRailing)"/>
</svg>
